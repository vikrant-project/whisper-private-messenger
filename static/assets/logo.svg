  <rect x="36" y="46" width="28" height="22" rx="4" fill="url(#glowGrad)" />
  <!-- Shackle -->
  <path d="M42 46 V37 C42 32.5 45.5 29 50 29 C54.5 29 58 32.5 58 37 V46" 
        fill="none" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Keyhole -->
